# Runtime directories on tmpfs (deployment-aws.md §4). Recreated at every boot.
# Traversable but not listable by others, so ma-aws reaches the outbox and Caddy
# reaches the server's socket, http.sock (0660, group caddy: the server runs with
# caddy as its primary group; auth-and-security.md §9).
d /run/memory-anywhere                 0751 memory-anywhere caddy   -
# Outbox: the server (group memory-anywhere) writes, ma-aws (owner) reads and deletes.
d /run/memory-anywhere/outbox          2770 ma-aws          memory-anywhere -
d /run/memory-anywhere/inbox           0751 memory-anywhere memory-anywhere -
# Drop directory: ma-aws writes fetched transfers, the server reads and deletes them.
d /run/memory-anywhere/inbox/drop      2770 ma-aws          memory-anywhere -
d /run/memory-anywhere/inbox/key       0700 memory-anywhere memory-anywhere -
# Selfcheck requests (eval stacks): the server writes the purged canaries here, root reads them.
d /run/memory-anywhere/selfcheck       0700 memory-anywhere memory-anywhere -
