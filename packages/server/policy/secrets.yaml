# Secret and never-store patterns (memory-policy.md §3.7). Policy P1.
#
# A match anywhere in a memory_save's content, user_words or why_durable rejects the save
# (write-path.md §5 row D1). In prompts and capture text each match is replaced with
# [REDACTED:<type>] before it is stored or spooled (write-path.md §3).
#
# Each entry: type (the redaction label), pattern (JavaScript regex source), flags (optional,
# "i" for case-insensitive), and optionally:
#   check: luhn | mod97     the digits (or IBAN) must also pass this checksum
#   near:  {pattern, flags, window}   another match must occur within `window` characters
# Patterns are tried in this order; at one position the first listed pattern wins, so the
# more specific token formats come before the generic ones.
# The entropy rule (any whitespace-free token of >= 20 characters with Shannon entropy
# >= 4.0 bits/char and at least 3 of lower, upper, digit, symbol) is built into redact.ts.

- type: aws_access_key
  pattern: '(?:AKIA|ASIA)[0-9A-Z]{16}'
- type: aws_secret
  pattern: '[A-Za-z0-9/+=]{40}'
  near: { pattern: 'aws', flags: i, window: 40 }
- type: github_token
  pattern: 'gh[pousr]_[A-Za-z0-9]{36,}'
- type: github_token
  pattern: 'github_pat_[A-Za-z0-9_]{80,}'
- type: slack_token
  pattern: 'xox[abprs]-[A-Za-z0-9-]{10,}'
- type: anthropic_key
  pattern: 'sk-ant-[A-Za-z0-9_-]{20,}'
- type: openai_key
  pattern: 'sk-[A-Za-z0-9_-]{20,}'
- type: google_api_key
  pattern: 'AIza[0-9A-Za-z_-]{35}'
- type: stripe_key
  pattern: '(?:sk|rk)_(?:live|test)_[0-9a-zA-Z]{24,}'
- type: private_key
  pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
- type: jwt
  pattern: 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
- type: payment_card
  pattern: '\b\d(?:[ -]?\d){12,18}\b'
  check: luhn
- type: iban
  pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
  check: mod97
- type: us_ssn
  pattern: '\b\d{3}-\d{2}-\d{4}\b'
- type: aadhaar
  pattern: '\b\d{4}\s\d{4}\s\d{4}\b'
- type: passport
  pattern: 'passport (?:no|number)[: ]+[A-Z0-9]{6,9}'
  flags: i
- type: password
  pattern: '(?:password|passcode|pin|passphrase)\s*(?:is|=|:)\s*\S+'
  flags: i
