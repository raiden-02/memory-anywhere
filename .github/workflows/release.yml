name: release

# A server release (deployment-aws.md §7.4): pushing a tag v<version> builds the linux-arm64
# tarball, checks it runs, signs it with the release key and publishes it as a GitHub release
# with its SHA-256 and ma-operator.sh. The signing job runs in the `release` environment, which
# requires the owner's manual approval and holds RELEASE_MINISIGN_KEY.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: work space
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: work space
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: work space/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: pnpm
          cache-dependency-path: work space/pnpm-lock.yaml
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]{1,32})?$ ]] || { echo "tag $TAG is not v<semver>"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: node scripts/build-server-release.ts "${{ steps.version.outputs.version }}" --out "$RUNNER_TEMP/release"
      - run: bash scripts/smoke-server-release.sh "$RUNNER_TEMP/release/memory-anywhere-server-${{ steps.version.outputs.version }}.tar.gz" "${{ steps.version.outputs.version }}"
      - run: bash scripts/audit-release-signatures.sh "$RUNNER_TEMP/release/memory-anywhere-server-${{ steps.version.outputs.version }}.tar.gz"
      - run: cp deploy/aws/ma-operator.sh "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  sign-and-publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: release
      - name: minisign (pinned, as on the instance)
        run: |
          # shellcheck source=/dev/null
          . deploy/aws/host/pins.env
          curl -fsSL --proto '=https' --retry 5 -o "$RUNNER_TEMP/minisign.tar.gz" "$MINISIGN_URL"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/aarch64/minisign
          install -m 0755 "$RUNNER_TEMP/minisign-linux/aarch64/minisign" /usr/local/bin/minisign
      - name: sign
        env:
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
        run: |
          [ -n "$RELEASE_MINISIGN_KEY" ] || { echo "RELEASE_MINISIGN_KEY is not set in the release environment"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_MINISIGN_KEY" >"$RUNNER_TEMP/release.key"
          tarball="release/memory-anywhere-server-$VERSION.tar.gz"
          sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          minisign -S -s "$RUNNER_TEMP/release.key" -m "$tarball" -x "$tarball.minisig" -t "memory-anywhere $VERSION sha256 $sha" </dev/null
          rm -f "$RUNNER_TEMP/release.key"
          # The committed public half must verify what was just signed.
          minisign -V -q -p deploy/aws/release-keys/release.pub -m "$tarball" -x "$tarball.minisig"
          (cd release && sha256sum "memory-anywhere-server-$VERSION.tar.gz" ma-operator.sh >SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "memory-anywhere server $VERSION" \
            --notes "Server release $VERSION for linux-arm64, signed with deploy/aws/release-keys/release.pub. Deploy with: mema deploy aws --update --release $VERSION" \
            "release/memory-anywhere-server-$VERSION.tar.gz" "release/memory-anywhere-server-$VERSION.tar.gz.minisig" \
            release/ma-operator.sh release/SHA256SUMS
